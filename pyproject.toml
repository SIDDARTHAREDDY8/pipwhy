[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pipwhy"
version = "0.1.0"
description = "pip's dependency conflicts, explained — find the blocker in a ResolutionImpossible dump"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Siddartha Reddy Chinthala" }]
keywords = ["pip", "dependencies", "conflict", "resolver", "packaging"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Build Tools",
    "Topic :: System :: Software Distribution",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/SIDDARTHAREDDY8/pipwhy"
Issues = "https://github.com/SIDDARTHAREDDY8/pipwhy/issues"

[project.scripts]
pipwhy = "pipwhy.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
